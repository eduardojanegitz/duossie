# Caso 000 — Treinamento: evidências.

- id: ev.como-funciona
  title: Como funciona
  kind: document
  visibleTo: both
  summary: Guia rápido do treinamento. Leia primeiro.
  body:
    - type: heading
      text: Duas perspectivas
    - type: text
      text: Vocês dois veem este documento. Quase todo o resto, não — cada papel tem os próprios arquivos, e o parceiro não vê os seus.
    - type: list
      items:
        - "Arquivos: suas evidências. As novas aparecem destacadas."
        - "Compartilhar: algumas evidências podem ser enviadas ao parceiro (botão no fim do documento). As que são peça de enigma não podem — descreva o que importa."
        - "Quadro: fixe evidências, crie anotações, agrupe, marque como hipótese, confirmado ou contradição, e conecte itens."
        - "Chat: o ícone de balão no topo. Dá para anexar uma evidência — o parceiro vê que ela existe, mas não o conteúdo, se não tiver acesso."
        - "Enigmas: cada um vê a sua parte do enunciado. Peça dicas se travar; elas vêm aos poucos."
        - "Diário: a linha do tempo do que a dupla já fez."
    - type: stamp
      text: CONVERSEM

# ---------------------------------------------------------------------------
# Capítulo 1 — cadeado (código)
# ---------------------------------------------------------------------------
- id: ev.legenda
  title: Legenda do cadeado
  kind: document
  visibleTo: A
  summary: O valor de cada símbolo do cadeado da Sala 3.
  body:
    - type: text
      text: O cadeado tem símbolos no lugar dos números. Esta legenda diz quanto vale cada um — mas não a ordem.
    - type: table
      columns: [Símbolo, Dígito]
      rows:
        - ["●", "1"]
        - ["◆", "4"]
        - ["▲", "7"]
        - ["■", "9"]

- id: ev.etiqueta
  title: Etiqueta no cadeado
  kind: object
  visibleTo: B
  summary: Uma etiqueta colada no próprio cadeado.
  body:
    - type: text
      text: Alguém colou no cadeado a sequência da senha, da esquerda para a direita. Você não sabe quanto vale cada símbolo — o Arquivo sabe.
    - type: stamp
      text: ▲  ◆  ●

- id: ev.memorando
  title: Memorando do instrutor
  kind: document
  visibleTo: A
  share: full
  summary: Exemplo de evidência que pode ser enviada ao parceiro.
  body:
    - type: handwriting
      text: "Treinamento de dupla: a Sala 3 amanheceu destrancada. Descubram quem saiu por último."
      note: Este documento pode ser compartilhado. Toque em “Enviar cópia” e veja no aparelho do parceiro.

- id: ev.foto-sala
  title: Foto da Sala 3
  kind: photo
  visibleTo: B
  share: full
  summary: A porta da Sala 3, aberta, de manhã.
  body:
    - type: text
      text: A porta da Sala 3 está entreaberta. O cadeado está pendurado, fechado, na maçaneta.
    - type: text
      text: Esta evidência também pode ser compartilhada com o parceiro.

