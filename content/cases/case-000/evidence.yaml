- id: ev.manual-a
  title: Manual do painel (parte 1)
  kind: document
  visibleTo: A
  availableWhen: { chapterReached: ch.avancado }
  summary: Metade das instruções do painel da Sala 3.
  body:
    - type: list
      items:
        - O painel tem chaves (com você) e uma alavanca (com o Campo).
        - Comece pela Chave 2.
        - A Chave 1 é sempre o último comando.

- id: ev.manual-b
  title: Manual do painel (parte 2)
  kind: document
  visibleTo: B
  availableWhen: { chapterReached: ch.avancado }
  summary: A outra metade das instruções do painel.
  body:
    - type: list
      items:
        - A alavanca está com você; as chaves, com o Arquivo.
        - Puxe a alavanca logo depois da primeira chave — nem antes, nem depois.
        - Comando fora de ordem trava o painel e ele volta ao início.
