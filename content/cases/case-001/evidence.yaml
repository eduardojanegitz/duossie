- id: ev.caderneta
  title: Caderneta do chefe de trem
  kind: document
  visibleTo: B
  availableWhen: { chapterReached: ch.trajeto }
  summary: Anotações de Aurélio Santos, chefe do trem 117.
  body:
    - type: handwriting
      text: "Partida SA — contagem visual: 11 cab. Sistema diz 12. Rever na próxima."
    - type: handwriting
      text: "Rosa reclamou do café frio de novo."
    - type: handwriting
      text: "Parada na ponte. Alarme porta 3B — fui ver: a moça da 23 estava no vestíbulo, disse que foi tomar ar. Porta já fechando."
    - type: handwriting
      text: "Chegada FL. Mala na 24."
    - type: text
      text: As anotações não têm horário; estão na ordem em que foram escritas.

- id: ev.depoimento-clara
  title: Depoimento — Clara Vidal
  kind: testimony
  visibleTo: B
  share: full
  availableWhen: { chapterReached: ch.trajeto }
  summary: Passageira da poltrona 23, ao lado da mala.
  body:
    - type: quote
      speaker: Clara Vidal
      text: O homem da 24 era calado, nem tirou o casaco. Quando o trem parou na ponte, ele levantou e foi para o vestíbulo. Ouvi o alarme da porta. Ele não voltou.
    - type: quote
      speaker: Clara Vidal
      text: A mala? Era dele, ficou na poltrona. Eu não mexi em nada.

- id: ev.depoimento-atendente
  title: Depoimento — Rosa Nunes (atendente)
  kind: testimony
  visibleTo: B
  availableWhen: { chapterReached: ch.trajeto }
  summary: Responsável pelo carrinho de lanches do trem 117.
  body:
    - type: quote
      speaker: Rosa Nunes
      text: Eu começo o serviço pelo carro 3 sempre logo depois que o trem passa por Vila Nogueira. Naquela noite foi igual.
    - type: quote
      speaker: Rosa Nunes
      text: A 24 estava vazia. Achei que o moço tinha ido ao banheiro. A moça da 23 estava com uma mala vermelha no chão, entre os pés. Pediu dois cafés, disse que um era "para o amigo da 24". Só bebeu um.

- id: ev.depoimento-jonas
  title: Depoimento — Jonas Ferraz
  kind: testimony
  visibleTo: B
  share: full
  availableWhen: { chapterReached: ch.trajeto }
  summary: Passageiro da poltrona 19, carro 3.
  body:
    - type: quote
      speaker: Jonas Ferraz
      text: Já sei que vão olhar minha ficha. Dormi quase a viagem toda, de verdade.
    - type: quote
      speaker: Jonas Ferraz
      text: Lembro de uma coisa só. Logo que o trem saiu, fui ao banheiro e a moça da 23 estava com uma mala vermelha no colo, abraçada nela. Do lado dela, ninguém.

