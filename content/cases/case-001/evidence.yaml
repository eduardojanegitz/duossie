- id: ev.armario
  title: Conteúdo do armário 12
  kind: object
  visibleTo: both
  availableWhen: { puzzleSolved: pz.armario }
  summary: Aberto pela polícia de Serra Alta às 02h10 com a senha informada.
  body:
    - type: list
      items:
        - Celular de Rafael Moura, desligado.
        - Carteira com os documentos de Rafael Moura.
        - "Comprovante de passagem de ônibus Serra Alta → Porto Fundo, 09/10, 23h30, em nome de \"R. Moreira\"."
        - Envelope com uma cópia da apólice de seguro.

- id: ev.mensagens
  title: Mensagens do celular de Rafael
  kind: message
  visibleTo: B
  share: full
  availableWhen: { puzzleSolved: pz.armario }
  summary: Conversas recuperadas do aparelho encontrado no armário.
  body:
    - type: heading
      text: Tomás (06/10)
    - type: quote
      speaker: Tomás
      text: A apólice tá no meu nome. Trinta dias depois do "acidente" eles pagam. Não liga pra ninguém.
    - type: heading
      text: Clara (08/10 e 09/10)
    - type: quote
      speaker: Rafael
      text: Você me deve aquela, Clara. Leva a mala, senta na 23 e deixa na 24 quando o trem parar na ponte. Para o relógio na hora e abre a porta pra disparar o alarme.
    - type: quote
      speaker: Clara
      text: E se perguntarem?
    - type: quote
      speaker: Rafael
      text: Diz que me viu ir pro vestíbulo. Só isso.
    - type: quote
      speaker: Clara (09/10, 21h20)
      text: Não consigo fazer isso.
    - type: quote
      speaker: Rafael (09/10, 21h46)
      text: Consegue sim. Lembra quem cobriu o seu rombo no caixa. A senha do armário tá no papel que eu te dei. Apaga essa conversa.
